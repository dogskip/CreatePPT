<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>말씀 PPT 생성기</title>
    <style>
        body {
            font-family: '나눔고딕', sans-serif;
            background-color: #f0f8ff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        label {
            font-weight: bold;
        }
        .btn {
            background-color: lightblue;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: deepskyblue;
        }
        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .alert-warning {
            background-color: #ff9800;
            color: white;
        }
        .alert-danger {
            background-color: #f44336;
            color: white;
        }
        .alert-success {
            background-color: #4caf50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>말씀 PPT 생성기</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <label for="text_file">설교노트 파일 (.txt)</label>
            <input type="file" id="text_file" name="text_file" accept=".txt" required>

            <label for="translation_set">번역본 선택</label>
            <select id="translation_set" name="translation_set" required>
                <option value="">-- 번역본을 선택하세요 --</option>
                {% for translation in translation_sets %}
                    <option value="{{ translation }}">{{ translation }}</option>
                {% endfor %}
                {% if translation_sets|length == 0 %}
                    <option value="" disabled>번역본이 없습니다.</option>
                {% endif %}
            </select>

            <label for="ppt_title">말씀 PPT 제목</label>
            <input type="text" id="ppt_title" name="ppt_title" placeholder="PPT 제목을 입력하세요" required>

            <button type="submit" class="btn">PPT 생성</button>
        </form>
    </div>
</body>
</html>
