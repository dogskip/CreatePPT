<!-- templates/change_lyrics.html -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가사 PPT 생성</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
    />
</head>
<body>
    <div class="container">
        <div class="title">
            <h2>가사 PPT 생성</h2>
            <button class="cancel" onclick="window.location.href='{{ url_for('index') }}'">
                <i class="fa-solid fa-xmark fa-2xl"></i>
            </button>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="menu">
            <a href="{{ url_for('change_lyrics_route', operation='change_lyrics') }}" class="request-type">가사 변경</a>
            <a href="{{ url_for('change_lyrics_route', operation='change_only_korean_lyrics') }}" class="request-type">기존 ppt에서 한글 가사만 변경</a>
            <a href="{{ url_for('change_lyrics_route', operation='change_only_english_lyrics') }}" class="request-type">기존 ppt에서 영어 가사만 변경</a>
            <a href="{{ url_for('change_lyrics_route', operation='create_lyrics') }}" class="request-type">가사 PPT 생성</a>
            <a href="{{ url_for('change_lyrics_route', operation='create_only_korean_lyrics') }}" class="request-type">한글 가사 PPT 생성</a>
            <a href="{{ url_for('change_lyrics_route', operation='create_only_english_lyrics') }}" class="request-type">영어 가사 PPT 생성</a>
            <a href="{{ url_for('change_lyrics_route', operation='create_seoul_form') }}" class="request-type">서울 형식 PPT 생성</a>
        </div>
    </div>
</body>
</html>
